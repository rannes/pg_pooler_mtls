static_resources:
  listeners:
    - name: pgbouncer_loopback
      address:
        socket_address: {address: 127.0.0.1, port_value: 15432}
      filter_chains:
        - filters:
            - name: envoy.filters.network.postgres_proxy
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.postgres_proxy.v3alpha.PostgresProxy
                stat_prefix: pgbouncer
                enable_sql_parsing: false
                upstream_ssl: REQUIRE
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: pgbouncer_tcp
                cluster: pgbouncer
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          pooler: pgbouncer
                          upstream: '%UPSTREAM_HOST%'
                          tls: '%UPSTREAM_TLS_VERSION%'
                          peer: '%UPSTREAM_PEER_SUBJECT%'
                          flags: '%RESPONSE_FLAGS%'
                          failure: '%UPSTREAM_TRANSPORT_FAILURE_REASON%'
    - name: pgdog_loopback
      address:
        socket_address: {address: 127.0.0.1, port_value: 15433}
      filter_chains:
        - filters:
            - name: envoy.filters.network.postgres_proxy
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.postgres_proxy.v3alpha.PostgresProxy
                stat_prefix: pgdog
                enable_sql_parsing: false
                upstream_ssl: REQUIRE
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: pgdog_tcp
                cluster: pgdog
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          pooler: pgdog
                          upstream: '%UPSTREAM_HOST%'
                          tls: '%UPSTREAM_TLS_VERSION%'
                          peer: '%UPSTREAM_PEER_SUBJECT%'
                          flags: '%RESPONSE_FLAGS%'
                          failure: '%UPSTREAM_TRANSPORT_FAILURE_REASON%'
  clusters:
    - name: pgbouncer
      type: STRICT_DNS
      connect_timeout: 3s
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: pgbouncer
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: pgbouncer, port_value: 6432}
      transport_socket:
        name: envoy.transport_sockets.starttls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.starttls.v3.UpstreamStartTlsConfig
          tls_socket_config:
            sni: pgbouncer
            common_tls_context:
              tls_params: {tls_minimum_protocol_version: TLSv1_2}
              tls_certificates:
                - certificate_chain: {filename: /run/tls/tls.crt}
                  private_key: {filename: /run/tls/tls.key}
              validation_context:
                trusted_ca: {filename: /run/tls/pooler-ca.crt}
                match_typed_subject_alt_names:
                  - san_type: DNS
                    matcher: {exact: pgbouncer}
    - name: pgdog
      type: STRICT_DNS
      connect_timeout: 3s
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: pgdog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: pgdog, port_value: 6432}
      transport_socket:
        name: envoy.transport_sockets.starttls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.starttls.v3.UpstreamStartTlsConfig
          tls_socket_config:
            sni: pgdog
            common_tls_context:
              tls_params: {tls_minimum_protocol_version: TLSv1_2}
              tls_certificates:
                - certificate_chain: {filename: /run/tls/tls.crt}
                  private_key: {filename: /run/tls/tls.key}
              validation_context:
                trusted_ca: {filename: /run/tls/pooler-ca.crt}
                match_typed_subject_alt_names:
                  - san_type: DNS
                    matcher: {exact: pgdog}
