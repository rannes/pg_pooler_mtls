[databases]
productdb = host=postgres port=5432 dbname=productdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = hba
auth_hba_file = /etc/pgbouncer/pg_hba.conf
auth_ident_file = /etc/pgbouncer/pg_ident.conf
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 4
min_pool_size = 0
max_client_conn = 80
server_connect_timeout = 4
server_login_retry = 1
query_wait_timeout = 6
client_login_timeout = 5
client_tls_sslmode = verify-ca
client_tls_ca_file = /run/tls/workload-ca.crt
client_tls_cert_file = /run/tls/server.crt
client_tls_key_file = /run/tls/server.key
server_tls_sslmode = verify-full
server_tls_ca_file = /run/tls/database-ca.crt
server_tls_cert_file = /run/tls/gateway.crt
server_tls_key_file = /run/tls/gateway.key
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
