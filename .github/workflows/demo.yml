name: Verify passwordless demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Boot actual services
        run: make up
      - name: Unit, adversarial, UI API, and deployment checks
        run: make test
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps -a > test-results/services.txt
          docker compose logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-failure-logs
          path: test-results/
          retention-days: 7
      - name: Stop services
        if: always()
        run: docker compose down -v
